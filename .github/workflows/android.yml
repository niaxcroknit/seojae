# Builds a test APK on every push to main (or by hand from the Actions tab).
# Download it from the run page under "Artifacts" and install it on a phone.
# The Play Store file (.aab) is still made in Android Studio with your own signing key.
name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Capacitor
        run: npm ci --omit=dev

      - name: Copy app screen into Android
        run: npx cap sync android

      - name: Build test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: seojaehankyeon-test-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
