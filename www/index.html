<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>서재한켠</title>
<link rel="stylesheet" href="fonts/gowun-batang/400.css">
<link rel="stylesheet" href="fonts/gowun-batang/700.css">
<link rel="stylesheet" href="fonts/ibm-plex-sans-kr/400.css">
<link rel="stylesheet" href="fonts/ibm-plex-sans-kr/500.css">
<link rel="stylesheet" href="fonts/ibm-plex-sans-kr/600.css">
<link rel="stylesheet" href="fonts/ibm-plex-mono/400.css">
<link rel="stylesheet" href="fonts/ibm-plex-mono/500.css">
<script src="capacitor.js"></script>
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,sans-serif;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<style>
/* Layout: one phone-width column on every screen; list first, the record slides over it */
:root {
  --bg: #F5F6F4;
  --surface: #FFFFFF;
  --ink: #1C1F1E;
  --muted: #6E7471;
  --line: #E2E5E2;
  --accent: #2F4A3F;
  --accent-soft: #E3EBE7;
  --hl: #F3E37C;
  --danger: #A33A2F;
  --desk: #E6E9E6;
  --display: "Gowun Batang", "Noto Serif KR", serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141615; --surface: #1C1F1E; --ink: #E9ECEA; --muted: #959C98;
    --line: #2C302E; --accent: #9CC3B1; --accent-soft: #24302B; --hl: #6B5E1E; --danger: #E08A7F; --desk: #0D0F0E;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141615; --surface: #1C1F1E; --ink: #E9ECEA; --muted: #959C98;
  --line: #2C302E; --accent: #9CC3B1; --accent-soft: #24302B; --hl: #6B5E1E; --danger: #E08A7F; --desk: #0D0F0E;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, [contenteditable]:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
mark { background: var(--hl); color: inherit; border-radius: 2px; padding: 0 1px; }
.label { font-size: 11px; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); margin: 0; }

/* ---------- sidebar / top ---------- */
.side { padding: 24px 16px 8px; display: flex; flex-direction: column; gap: 14px; }
.side h1 { font-family: var(--display); font-weight: 700; font-size: 26px; margin: 0; letter-spacing: -0.01em; }
.summary { color: var(--muted); font-size: 13px; margin: -8px 0 0; }
.summary b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
.search { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; }
.search-row { display: flex; gap: 8px; }
.search-row .search { flex: 1; min-width: 0; }
.check { flex: none; position: relative; display: flex; align-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 12px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.check input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.check-msg { margin: -4px 0 0; font-size: 13px; background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.check-msg.err { color: var(--danger); }
.check-msg button { border: 0; background: none; color: inherit; font-weight: 600; cursor: pointer; padding: 0; white-space: nowrap; }
.filters { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; display: flex; gap: 6px; align-items: baseline; }
.chip small { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip[aria-pressed="true"] small { color: var(--bg); opacity: .7; }
.stats-block { display: flex; flex-direction: column; gap: 14px; margin-top: 28px; padding-top: 18px; border-top: 1px solid var(--line); }
.stat-nums { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat-nums div { display: flex; flex-direction: column; gap: 2px; }
.stat-nums b { font-family: var(--mono); font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
.stat-nums span { font-size: 12px; color: var(--muted); }
.months { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 4px; align-items: end; height: 60px; }
.months div { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; height: 100%; gap: 3px; }
.months i { width: 100%; max-width: 16px; background: var(--accent); border-radius: 2px; min-height: 2px; display: block; }
.months i.z { background: var(--line); }
.months span { font-size: 10px; color: var(--muted); font-family: var(--mono); }
.months em { font-style: normal; font-size: 10px; color: var(--accent); font-family: var(--mono); min-height: 12px; }
.export-row { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.export-msg { font-size: 12px; color: var(--muted); }
.app.feed-mode .stats-block { display: none !important; }
.entry { border-bottom: 1px solid var(--line); }
.qp { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 0 0 12px 56px; }
.qp .bar { height: 4px; }
.qp-ctl { display: flex; align-items: center; gap: 4px; white-space: nowrap; font-family: var(--mono); font-size: 13px; color: var(--muted); }
.qp-ctl button { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; font-size: 15px; }
.qp-ctl button:disabled { opacity: .5; cursor: default; }
.qp-ctl input[type=number] { width: 58px; flex: none; text-align: center; font-family: var(--mono); font-size: 14px; padding: 5px 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.start-cta { display: flex; flex-direction: column; gap: 8px; }
.start-cta .btn { padding: 13px 16px; font-size: 15px; }
.done-cta { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 12px 14px; font-size: 14px; }
.done-cta b { font-family: var(--display); font-size: 16px; display: block; color: var(--ink); }
.detail:not([data-status="done"]) [data-show="done"], .detail:not([data-status="reading"]) [data-show="reading"], .detail:not([data-status="unread"]) [data-show="unread"] { display: none !important; }
.detail[data-status="unread"] .d-tabs { display: none; }
.detail[data-status="unread"] .sec { display: none !important; }
.detail[data-status="unread"] .sec-info { display: flex !important; }
.detail[data-status="reading"] .d-tabs [data-t="pages"] { order: -1; }

/* ---------- shelf ---------- */
.shelf-wrap { padding: 4px 16px 110px; }
.shelf-head { display: none; }
.shelf { display: flex; flex-direction: column; }
.item { display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 0; border: 0; background: none; text-align: left; cursor: pointer; width: 100%; }
.cover { width: 44px; aspect-ratio: 2 / 3; border-radius: 3px; overflow: hidden; position: relative; background: var(--line); max-width: 100%; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph { width: 100%; height: 100%; display: flex; align-items: flex-end; padding: 4px; color: #fff; font-family: var(--display); font-size: 8px; line-height: 1.2; overflow: hidden; }
.meta { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.t { font-family: var(--display); font-weight: 700; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.a { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.one { font-size: 13px; color: var(--ink); opacity: .8; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line); color: var(--muted); }
.pill.reading { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill.done { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.item .stars { display: none; }
.item .cover .side-only { display: none; }
.tag { font-size: 10px; color: var(--muted); border: 1px dashed var(--muted); border-radius: 3px; padding: 0 4px; margin-left: 6px; font-family: var(--body); font-weight: 400; vertical-align: 2px; }
.empty { padding: 32px 0; color: var(--muted); font-size: 14px; display: flex; flex-direction: column; gap: 4px; }
.empty strong { color: var(--ink); font-family: var(--display); font-size: 17px; }

.fab { position: fixed; right: 16px; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); border: 0; background: var(--ink); color: var(--bg); font-weight: 600; padding: 13px 20px; border-radius: 999px; cursor: pointer; box-shadow: 0 6px 20px rgba(0,0,0,.18); z-index: 5; }

/* ---------- detail ---------- */
.detail { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px)) 0 calc(40px + env(safe-area-inset-bottom, 0px)); }
.d-inner { max-width: 760px; margin: 0 auto; padding: 0 16px; display: flex; flex-direction: column; gap: 18px; }
.d-bar { position: sticky; top: 0; z-index: 2; background: var(--bg); display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.back { border: 0; background: none; cursor: pointer; padding: 4px 0; font-weight: 600; }
.saved { font-size: 12px; color: var(--muted); }
.d-head { display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 16px; align-items: start; }
.d-head .cover { width: 76px; }
.d-head .ph { font-size: 11px; padding: 6px; }
.d-title { font-family: var(--display); font-size: 22px; font-weight: 700; margin: 0; line-height: 1.3; overflow-wrap: anywhere; text-wrap: balance; }
.d-author { color: var(--muted); font-size: 14px; margin: 2px 0 0; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { flex: 1; border: 0; background: none; font-size: 14px; color: var(--muted); padding: 9px 4px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.rate { display: flex; gap: 2px; }
.rate button { border: 0; background: none; font-size: 24px; line-height: 1; color: var(--line); cursor: pointer; padding: 2px; }
.rate button.on { color: var(--accent); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .field > .label { font-size: 12px; color: var(--muted); font-weight: 400; letter-spacing: 0; }
input[type=text], input[type=number], input[type=date], textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0;
}
.oneline { font-family: var(--display); font-size: 16px; }
.prog { display: grid; grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 8px; align-items: center; }
.prog button { height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; cursor: pointer; }
.prog-mid { display: flex; align-items: center; gap: 8px; justify-content: center; font-family: var(--mono); font-size: 14px; }
.prog-mid input { width: 84px; text-align: center; font-family: var(--mono); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

.d-tabs { display: flex; border-bottom: 1px solid var(--line); gap: 18px; position: sticky; top: 53px; background: var(--bg); z-index: 1; }
.d-tabs button { border: 0; background: none; padding: 10px 0; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 5px; align-items: baseline; }
.d-tabs button small { font-family: var(--mono); font-size: 11px; }
.d-tabs button[aria-selected="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.sec { display: none; flex-direction: column; gap: 12px; }
.detail[data-tab="essay"] .sec-essay, .detail[data-tab="pages"] .sec-pages, .detail[data-tab="hl"] .sec-hl, .detail[data-tab="info"] .sec-info { display: flex; }
.sec h3 { display: none; font-family: var(--display); font-size: 17px; margin: 0; }
.sec-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }

.tool { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hl-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 5px 12px 5px 8px; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.hl-btn::before { content: ""; width: 14px; height: 14px; border-radius: 3px; background: var(--hl); }
.hint { font-size: 12px; color: var(--muted); }
.editor { min-height: 96px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; font-family: var(--display); font-size: 16px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; outline: none; }
.editor:focus { border-color: var(--accent); min-height: 200px; }
.editor:empty::before { content: attr(data-ph); color: var(--muted); }
.editor.sm:focus { min-height: 120px; }
.editor.sm { min-height: 64px; padding: 12px; font-size: 15px; line-height: 1.75; }
.editor[contenteditable="false"] { background: transparent; }
.pnote { display: flex; flex-direction: column; gap: 8px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.pnote-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pnote-head .pg { display: flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 14px; }
.pnote-head .pg input { width: 76px; padding: 6px 8px; font-family: var(--mono); }
.pnote-head .sp { flex: 1; }
.link { border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 13px; padding: 4px; }
.link.danger { color: var(--danger); }
.btn { font-weight: 600; border-radius: 8px; padding: 10px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.sm { padding: 6px 12px; font-size: 13px; }
.hl-item { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; background: var(--surface); border-radius: 8px; border: 1px solid var(--line); }
.hl-item p { margin: 0; font-family: var(--display); font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
.hl-item p mark { padding: 1px 2px; }
.hl-item span { font-size: 12px; color: var(--muted); font-family: var(--mono); }
.info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.info-grid .wide { grid-column: 1 / -1; }
.colors { display: flex; gap: 8px; flex-wrap: wrap; }
.colors button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.colors button[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--surface); }
.confirm { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; color: var(--danger); font-size: 13px; }
.banner { background: var(--accent-soft); color: var(--accent); border-radius: 8px; padding: 10px 12px; font-size: 13px; }
.placeholder { display: none; }
.native .social-only { display: none !important; }
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
input[type=number] { -moz-appearance: textfield; appearance: textfield; }
.views { display: flex; gap: 20px; border-bottom: 1px solid var(--line); }
.views button { border: 0; background: none; padding: 8px 0; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; font-size: 15px; }
.views button[aria-pressed="true"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--ink); }
.app.feed-mode .search-row, .app.feed-mode .filters, .app.feed-mode .check-msg, .app.feed-mode .shelf-head, .app.feed-mode .shelf { display: none !important; }
.feed { display: flex; flex-direction: column; gap: 12px; padding-top: 8px; }
.rev-book { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.rev-book b { font-family: var(--display); font-size: 15px; color: var(--ink); font-weight: 700; overflow-wrap: anywhere; }
.rev.tap { cursor: pointer; }
.rev .lock { color: var(--muted); font-size: 13px; }
.rev .reveal { border: 0; background: none; color: var(--accent); font-weight: 600; cursor: pointer; padding: 0; font-size: 13px; }
.seg.sm button { padding: 6px 4px; font-size: 13px; }
.shared { display: flex; flex-direction: column; gap: 10px; }
.locked { border: 1px dashed var(--line); border-radius: 10px; padding: 14px; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 2px; }
.locked b { color: var(--ink); font-family: var(--display); font-size: 15px; font-weight: 700; }
.rev { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; background: var(--surface); }
.rev.mine { background: var(--accent-soft); border-color: transparent; }
.rev-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; color: var(--muted); }
.rev-top b { color: var(--ink); font-weight: 600; }
.rev-top .stars { color: var(--accent); letter-spacing: 1px; font-size: 12px; }
.rev > p { margin: 0; font-family: var(--display); font-size: 15px; line-height: 1.6; overflow-wrap: anywhere; }
.replies { display: flex; flex-direction: column; gap: 6px; border-left: 2px solid var(--line); padding-left: 10px; }
.reply { font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
.reply b { font-weight: 600; margin-right: 6px; }
.reply .when { color: var(--muted); font-family: var(--mono); font-size: 11px; margin-left: 6px; }
.reply .link { font-size: 12px; padding: 0 4px; }
.reply-form { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px; }
.reply-form input { padding: 7px 10px !important; font-size: 13px; }
.reply-form .btn { padding: 6px 12px; font-size: 13px; }

/* ---------- add sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(10,12,11,.38); z-index: 30; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-radius: 16px 16px 0 0; max-height: 92%; overflow-y: auto; padding: 20px 16px calc(24px + env(safe-area-inset-bottom, 0px)); }
.sheet-inner { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; }
.sheet-head h2 { font-family: var(--display); font-size: 20px; margin: 0; }
.sheet input[type=text], .sheet input[type=number] { background: var(--bg); }
.cams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cam { position: relative; padding: 20px 10px !important; border: 1px dashed var(--muted); border-radius: 10px; padding: 14px 10px; background: var(--bg); cursor: pointer; display: flex; flex-direction: column; gap: 2px; align-items: center; text-align: center; }
.cams { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cam b { font-size: 14px; }
.cam span { font-size: 12px; color: var(--muted); }
.cam input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.scan-msg { font-size: 13px; color: var(--accent); min-height: 1em; margin: 0; }
.scan-msg.err { color: var(--danger); }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.prev { display: flex; gap: 10px; align-items: center; }
.prev img { width: 48px; aspect-ratio: 2/3; object-fit: cover; border-radius: 3px; }

.crop { position: fixed; inset: 0; z-index: 40; background: rgba(10,12,11,.86); display: flex; align-items: center; justify-content: center; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
.crop-inner { width: 100%; max-width: 560px; max-height: 100%; display: flex; flex-direction: column; gap: 14px; color: #fff; }
.crop-head { display: flex; flex-direction: column; gap: 2px; }
.crop-head b { font-family: var(--display); font-size: 18px; }
.crop-head .note { color: rgba(255,255,255,.7); }
.crop-body { display: flex; justify-content: center; min-height: 0; }
.crop-stage { position: relative; display: inline-block; touch-action: none; line-height: 0; }
.crop-stage canvas { display: block; max-width: 100%; max-height: 62vh; width: auto; height: auto; border-radius: 4px; }
.crop-stage svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.crop-stage polygon { fill: rgba(243,227,124,.12); stroke: #F3E37C; stroke-width: .5; vector-effect: non-scaling-stroke; }
.hd { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border: 0; background: none; padding: 0; cursor: grab; touch-action: none; }

<script>

    box.addEventListener("click", function (e) {
      var d = e.target.closest("[data-del-reply]"); if (!d) return;
      delete myReplies[d.dataset.delReply]; replyDirty = true;
      drawShared(byId(b.id)); schedulePublish(true);
    });
  }

  var lt, st;
  function renderListSoon() { clearTimeout(lt); lt = setTimeout(renderList, 250); }
  function renderSideSoon() { clearTimeout(st); st = setTimeout(renderSide, 250); }

  // ---------- images ----------
  function loadImage(file) {
    return new Promise(function (res, rej) {
      var url = URL.createObjectURL(file); var img = new Image();
      img.onload = function () { res(img); }; img.onerror = function () { rej(new Error("image")); }; img.src = url;
    });
  }
  function dims(img) { return { w: img.naturalWidth || img.width, h: img.naturalHeight || img.height }; }
  function toCanvas(img, max) {
    var d = dims(img), s = Math.min(1, max / Math.max(d.w, d.h));
    var c = document.createElement("canvas"); c.width = Math.round(d.w * s); c.height = Math.round(d.h * s);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); return c;
  }
  function canvasBlob(c, q) { return new Promise(function (res) { c.toBlob(res, "image/jpeg", q || 0.8); }); }
  async function storeCover(src) {
    if (assets) {
      var blob = await canvasBlob(toCanvas(src, 700), 0.85);
      var r = await assets.upload(blob);
      return { coverId: r.id };
    }
    return { coverData: toCanvas(src, 240).toDataURL("image/jpeg", 0.72) };
  }

  // Claude looks at the photo once: book info + where the cover's four corners are
  var readCache = new WeakMap();
  function readCover(img) {
    if (!sample) return Promise.resolve(null);
    if (readCache.has(img)) return readCache.get(img);
    var p = canvasBlob(toCanvas(img, 1200), 0.85).then(function (blob) {
      return sample.json('이 사진은 책 표지를 찍은 것입니다.\n1) 표지에 실제로 보이는 글자만 근거로 제목, 저자, 출판사를 적어 주세요. 부제와 홍보 문구는 빼고, 안 보이는 항목은 빈 문자열로 두세요.\n2) 사진 속 책 앞표지의 네 모서리 위치를 사진 너비와 높이에 대한 0~1 비율로, 왼쪽 위·오른쪽 위·오른쪽 아래·왼쪽 아래 순서로 적어 주세요. 표지가 잘려 있으면 보이는 끝을 쓰세요.\nJSON만 답하세요: {"title":"","author":"","publisher":"","corners":[[0.1,0.1],[0.9,0.1],[0.9,0.9],[0.1,0.9]]}', { images: [blob], modelTier: "quick" });
    });
    readCache.set(img, p);
    return p;
  }
  function validCorners(c) {
    if (!Array.isArray(c) || c.length !== 4) return null;
    for (var i = 0; i < 4; i++) { if (!Array.isArray(c[i]) || c[i].length !== 2) return null; for (var j = 0; j < 2; j++) { var v = +c[i][j]; if (!(v >= -0.02 && v <= 1.02)) return null; } }
    var q = c.map(function (p) { return [Math.min(1, Math.max(0, +p[0])), Math.min(1, Math.max(0, +p[1]))]; });
    var area = 0; for (var k = 0; k < 4; k++) { var a = q[k], b = q[(k + 1) % 4]; area += a[0] * b[1] - b[0] * a[1]; }
    return Math.abs(area / 2) > 0.05 ? q : null;
  }

  // perspective straighten
  function solveH(srcPts, W, H) {
    var dst = [[0, 0], [W, 0], [W, H], [0, H]], A = [], B = [];
    for (var i = 0; i < 4; i++) {
      var u = dst[i][0], v = dst[i][1], x = srcPts[i][0], y = srcPts[i][1];
      A.push([u, v, 1, 0, 0, 0, -u * x, -v * x]); B.push(x);
      A.push([0, 0, 0, u, v, 1, -u * y, -v * y]); B.push(y);
    }
    for (var c = 0; c < 8; c++) {
      var piv = c; for (var r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
      var t = A[c]; A[c] = A[piv]; A[piv] = t; var tb = B[c]; B[c] = B[piv]; B[piv] = tb;
      for (var r2 = 0; r2 < 8; r2++) { if (r2 === c) continue; var f = A[r2][c] / A[c][c]; for (var k = c; k < 8; k++) A[r2][k] -= f * A[c][k]; B[r2] -= f * B[c]; }
    }
    return B.map(function (b, i) { return b / A[i][i]; });
  }
  function straighten(img, q) {
    var srcC = toCanvas(img, 1800), sw = srcC.width, sh = srcC.height;
    var sd = srcC.getContext("2d").getImageData(0, 0, sw, sh).data;
    var P = q.map(function (p) { return [p[0] * sw, p[1] * sh]; });
    var dist = function (a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1]); };
    var W = (dist(P[0], P[1]) + dist(P[3], P[2])) / 2, H = (dist(P[0], P[3]) + dist(P[1], P[2])) / 2;
    var s = Math.min(1, 1000 / Math.max(W, H)); W = Math.max(20, Math.round(W * s)); H = Math.max(20, Math.round(H * s));
    var h = solveH(P, W, H);
    var out = document.createElement("canvas"); out.width = W; out.height = H;
    var ctx = out.getContext("2d"), od = ctx.createImageData(W, H), o = od.data;
    for (var y = 0; y < H; y++) for (var x = 0; x < W; x++) {
      var den = h[6] * x + h[7] * y + 1, fx = (h[0] * x + h[1] * y + h[2]) / den, fy = (h[3] * x + h[4] * y + h[5]) / den;
      var x0 = Math.floor(fx), y0 = Math.floor(fy), ax = fx - x0, ay = fy - y0;
      if (x0 < 0) { x0 = 0; ax = 0; } if (y0 < 0) { y0 = 0; ay = 0; }
      if (x0 >= sw - 1) { x0 = sw - 2; ax = 1; } if (y0 >= sh - 1) { y0 = sh - 2; ay = 1; }
      var i00 = (y0 * sw + x0) * 4, i10 = i00 + 4, i01 = i00 + sw * 4, i11 = i01 + 4, oi = (y * W + x) * 4;
      for (var ch = 0; ch < 3; ch++) {
        o[oi + ch] = (sd[i00 + ch] * (1 - ax) + sd[i10 + ch] * ax) * (1 - ay) + (sd[i01 + ch] * (1 - ax) + sd[i11 + ch] * ax) * ay;
      }
      o[oi + 3] = 255;
    }
    autoLevels(o);
    ctx.putImageData(od, 0, 0);
    return out;
  }
  function autoLevels(d) {
    var n = d.length / 4;
    for (var ch = 0; ch < 3; ch++) {
      var hist = new Uint32Array(256); for (var i = ch; i < d.length; i += 4) hist[d[i]]++;
      var lo = 0, hi = 255, acc = 0; while (lo < 255 && (acc += hist[lo]) < n * 0.005) lo++;
      acc = 0; while (hi > 0 && (acc += hist[hi]) < n * 0.005) hi--;
      if (hi - lo < 40) continue;
      var sc = 255 / (hi - lo);
      for (var j = ch; j < d.length; j += 4) { var v = (d[j] - lo) * sc; v = v < 0 ? 0 : v > 255 ? 255 : v; d[j] = d[j] * 0.25 + v * 0.75; }
    }
  }

  // cleanup dialog: drag corners, straighten, preview. Resolves a canvas, or null if closed.
  var DEFAULT_Q = [[0.08, 0.06], [0.92, 0.06], [0.92, 0.94], [0.08, 0.94]];
  function cleanCover(img) {
    return new Promise(function (resolve) {
      var q = DEFAULT_Q.map(function (p) { return p.slice(); }), touched = false, result = null;
      var cv = $("cropCanvas"), stage = $("cropStage"), hds = stage.querySelectorAll(".hd");
      var preview = toCanvas(img, 1200); cv.width = preview.width; cv.height = preview.height;
      cv.getContext("2d").drawImage(preview, 0, 0);
      function draw() {
        hds.forEach(function (h, i) { h.style.left = (q[i][0] * 100) + "%"; h.style.top = (q[i][1] * 100) + "%"; });
        $("cropPoly").setAttribute("points", q.map(function (p) { return (p[0] * 100) + "," + (p[1] * 100); }).join(" "));
      }
      function mode(b) { $("cropA").hidden = b; $("cropB").hidden = !b; stage.hidden = b; $("cropOut").hidden = !b; }
      var note = $("cropNote");
      note.textContent = sample ? "표지 모서리를 찾는 중… 노란 점을 직접 옮겨도 돼요." : "노란 점 네 개를 표지 귀퉁이에 맞춰 주세요.";
      readCover(img).then(function (info) {
        var c = info && validCorners(info.corners);
        if (c && !touched) { q = c; draw(); }
        if (!$("crop").hidden && !result) note.textContent = c ? "표지를 찾았어요. 어긋난 곳은 노란 점을 옮겨 맞춰 주세요." : "노란 점 네 개를 표지 귀퉁이에 맞춰 주세요.";
      }, function () { note.textContent = "노란 점 네 개를 표지 귀퉁이에 맞춰 주세요."; });

      var active = -1;
      function onDown(e) { active = +e.currentTarget.dataset.i; touched = true; e.currentTarget.setPointerCapture(e.pointerId); e.preventDefault(); }
      function onMove(e) {
        if (active < 0) return; var r = cv.getBoundingClientRect();
        q[active] = [Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), Math.min(1, Math.max(0, (e.clientY - r.top) / r.height))]; draw();
      }
      function onUp() { active = -1; }
      function onKey(e) {
        var i = +e.currentTarget.dataset.i, step = e.shiftKey ? 0.02 : 0.005, d = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] }[e.key];
        if (!d) return; e.preventDefault(); touched = true; q[i] = [Math.min(1, Math.max(0, q[i][0] + d[0])), Math.min(1, Math.max(0, q[i][1] + d[1]))]; draw();
      }
      hds.forEach(function (h) { h.onpointerdown = onDown; h.onpointermove = onMove; h.onpointerup = onUp; h.onpointercancel = onUp; h.onkeydown = onKey; });

      function finish(v) { $("crop").hidden = true; document.removeEventListener("keydown", esc, true); resolve(v); }
      function esc(e) { if (e.key === "Escape") { e.stopPropagation(); finish(null); } }
      document.addEventListener("keydown", esc, true);
      $("cropOrig").onclick = function () { finish(toCanvas(img, 1000)); };
      $("cropGo").onclick = function () {
        note.textContent = "펴는 중…";
        setTimeout(function () {
          result = straighten(img, q);
          var oc = $("cropOut"); oc.width = result.width; oc.height = result.height; oc.getContext("2d").drawImage(result, 0, 0);
          note.textContent = "반듯하게 펴고 밝기를 맞췄어요."; mode(true);
        }, 30);
      };
      $("cropBack").onclick = function () { result = null; note.textContent = "노란 점을 옮겨 다시 맞춰 주세요."; mode(false); };
      $("cropUse").onclick = function () { finish(result); };
      mode(false); draw(); $("crop").hidden = false; $("cropGo").focus();
    });
  }

  // ---------- owned-book check (by title) ----------
  function normTitle(t) { return String(t || "").toLowerCase().replace(/[\s\p{P}\p{S}]/gu, ""); }
  function findByTitle(t, author) {
    var n = normTitle(t); if (n.length < 2) return null;
    var hits = books.filter(function (b) { var m = normTitle(b.title); return m && (m === n || (Math.min(m.length, n.length) >= 3 && (m.indexOf(n) >= 0 || n.indexOf(m) >= 0))); });
    if (hits.length > 1 && author) { var a = normTitle(author); var h = hits.find(function (b) { return normTitle(b.author) === a; }); if (h) return h; }
    return hits[0] || null;
  }

  // ---------- add sheet ----------
  var draft = null;
  function updateCamCopy() {
    $("camCoverSub").textContent = sample ? "사진을 반듯하게 다듬고, 제목·저자·출판사를 채워요." : "사진을 반듯하게 다듬어 표지로 써요.";
    $("checkLabel").hidden = !sample;
  }
  function openSheet() {
    draft = { status: "unread", cover: null, img: null };
    ["a-title", "a-author", "a-pub", "a-pages"].forEach(function (id) { $(id).value = ""; });
    Array.prototype.forEach.call($("a-status").children, function (b) { b.setAttribute("aria-pressed", b.dataset.v === "unread"); });
    msg(""); $("addErr").hidden = true; $("coverPrev").hidden = true;
    $("scrim").hidden = false; $("sheet").hidden = false;
  }
  function closeSheet() { $("scrim").hidden = true; $("sheet").hidden = true; draft = null; }
  function msg(t, err) { var m = $("scanMsg"); m.textContent = t; m.classList.toggle("err", !!err); }
  $("addBtn").onclick = openSheet;
  $("sheetClose").onclick = closeSheet;
  $("scrim").onclick = closeSheet;
  $("a-status").addEventListener("click", function (e) { var b = e.target.closest("button"); if (!b) return; draft.status = b.dataset.v; Array.prototype.forEach.call($("a-status").children, function (x) { x.setAttribute("aria-pressed", x === b); }); });

  function setDraftCover(c) { draft.cover = c; $("coverPrevImg").src = c.toDataURL("image/jpeg", 0.85); $("coverPrev").hidden = false; }
  async function cropDraft() {
    var c = await cleanCover(draft.img);
    if (c && draft) setDraftCover(c);
  }
  $("reCrop").onclick = function () { if (draft && draft.img) cropDraft(); };

  $("camShoot").addEventListener("change", function (e) { coverPicked(e); });
  $("camCover").addEventListener("change", function (e) { coverPicked(e); });
  async function coverPicked(e) {
    var f = e.target.files[0]; e.target.value = ""; if (!f) return;
    var img;
    try { img = await loadImage(f); } catch (x) { msg("사진을 열지 못했어요. 다시 찍어 주세요.", true); return; }
    draft.img = img;
    if (sample) msg("표지에서 제목과 저자를 읽는 중…");
    readCover(img).then(function (info) {
      if (!draft || draft.img !== img) return;
      if (info && info.title) {
        $("a-title").value = info.title;
        if (info.author) $("a-author").value = info.author;
        if (info.publisher) $("a-pub").value = info.publisher;
        var d = findByTitle(info.title, info.author);
        msg(d ? "이미 서재에 있는 책 같아요: 《" + d.title + "》 · " + ST[d.status] : "표지에서 읽었어요. 틀린 곳이 있으면 고쳐 주세요.", !!d);
      } else if (sample) msg("표지 글자를 읽지 못했어요. 제목을 직접 입력해 주세요.", true);
    }, function (err) {
      if (!draft || draft.img !== img) return;
      msg(err && err.code === "not_granted" ? "자동 입력이 꺼져 있어요. 제목을 직접 입력해 주세요." : "표지 글자를 읽지 못했어요. 제목을 직접 입력해 주세요.", true);
    });
    await cropDraft();
  }

  function checkMsg(html, err) { var m = $("checkMsg"); m.innerHTML = html; m.classList.toggle("err", !!err); m.hidden = !html; }
  $("checkMsg").addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    if (t.dataset.open) { checkMsg(""); filter = "all"; query = ""; $("search").value = ""; renderSide(); renderList(); openDetail(t.dataset.open); }
    else checkMsg("");
  });
  $("camCheck").addEventListener("change", async function (e) {
    var f = e.target.files[0]; e.target.value = ""; if (!f || !sample) return;
    checkMsg("<span>표지를 읽는 중…</span>");
    try {
      var blob = await canvasBlob(toCanvas(await loadImage(f), 1000), 0.85);
      var info = await sample.json('이 사진은 책 표지입니다. 표지에 실제로 보이는 글자만 근거로 제목과 저자를 적어 주세요. 부제와 홍보 문구는 빼고, 안 보이면 빈 문자열로 두세요. JSON만 답하세요: {"title":"","author":""}', { images: [blob], modelTier: "quick" });
      if (!info || !info.title) { checkMsg('<span>표지 글자를 읽지 못했어요. 제목이 잘 보이게 다시 찍어 주세요.</span><button type="button">닫기</button>', true); return; }
      var d = findByTitle(info.title, info.author);
      if (d) checkMsg('<span>이미 갖고 있어요. 《' + esc(d.title) + '》 · ' + ST[d.status] + '</span><button type="button" data-open="' + esc(d.id) + '">열기</button>', true);
      else checkMsg('<span>서재에 없는 책이에요. 《' + esc(info.title) + '》</span><button type="button">닫기</button>');
    } catch (err) {
      checkMsg('<span>' + (err && err.code === "not_granted" ? "표지 읽기가 꺼져 있어요." : "표지를 읽지 못했어요. 다시 찍어 주세요.") + '</span><button type="button">닫기</button>', true);
    }
  });

  $("addForm").addEventListener("submit", async function (e) {
    e.preventDefault();
    var title = $("a-title").value.trim();
    var err = $("addErr");
    if (!title) { err.textContent = "제목을 입력해 주세요."; err.hidden = false; $("a-title").focus(); return; }
    if (!store) { err.textContent = "저장소에 연결하는 중이에요. 잠시 후 다시 눌러 주세요."; err.hidden = false; return; }
    var btn = $("addSave"); btn.disabled = true; btn.textContent = "꽂는 중…";
    var b = normalize({
      id: uid(), title: title, author: $("a-author").value.trim(), publisher: $("a-pub").value.trim(),
      pages: num($("a-pages").value), current: 0, status: draft.status, rating: 0, oneLine: "", essay: [], pageNotes: [],
      color: SPINES[Math.floor(Math.random() * SPINES.length)], createdAt: new Date().toISOString(),
      startedAt: draft.status !== "unread" ? today() : "", finishedAt: draft.status === "done" ? today() : ""
    });
    if (b.status === "done" && b.pages) b.current = b.pages;
    if (draft.cover) { try { Object.assign(b, await storeCover(draft.cover)); } catch (x) {} }
    try {
      pending[b.id] = true;
      books.push(b);
      await store.save(b);
      pending[b.id] = false;
      closeSheet(); filter = "all"; renderSide(); renderList(); dTab = "essay"; openDetail(b.id);
    } catch (x) {
      books = books.filter(function (y) { return y.id !== b.id; }); pending[b.id] = false;
      err.textContent = x && x.code === "quota_exceeded" ? "저장 공간이 가득 찼어요." : "추가하지 못했어요. 잠시 후 다시 시도해 주세요."; err.hidden = false;
    } finally { btn.disabled = false; btn.textContent = "서재에 추가"; }
  });

  // ---------- boot ----------
  renderAll();
  if (IS_APP) bootApp().catch(function () { useLocal(""); });
  else if (window.claude && window.claude.use) connect();
  else setTimeout(function () { if (window.claude && window.claude.use) connect(); else useLocal("이 브라우저에만 저장되고 있어요."); }, 600);
})();
</script>

</body>
